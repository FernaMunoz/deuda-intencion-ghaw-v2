description: |
  A repository assistant for Keycloak.AuthServices .NET libraries that runs daily to support contributors and maintainers.
  Can also be triggered on-demand via '/keybot <instructions>' to perform specific tasks.
  - Labels and triages open issues
  - Comments helpfully on Keycloak configuration questions and integration issues
  - Identifies fixable bugs and creates draft pull requests with fixes
  - Improves code quality, testing, and performance via PRs
  - Makes engineering investments: dependency updates, CI improvements, tooling
  - Updates its own PRs when CI fails or merge conflicts arise
  - Nudges stale PRs waiting for author response
  - Maintains a persistent memory of work done and what remains
  Always polite, constructive, and mindful of the project's goals.

on:
  schedule: "0 2 */2 * *"
  workflow_dispatch:
  slash_command:
    name: keybot
  reaction: "eyes"

timeout-minutes: 60

permissions: read-all

network:
  allowed:
  - defaults
  - dotnet

checkout:
  fetch: ["*"]
  fetch-depth: 0

runtimes:
  dotnet:
    version: "10.0"

safe-outputs:
  messages:
    run-started: "KeyBot is processing {event_type}... [View run]({run_url})"
    run-success: "KeyBot completed successfully. [View run]({run_url})"
    run-failure: "KeyBot encountered {status}. [View run]({run_url})"
    footer: "> Generated by 🤖 KeyBot. [Learn more](https://github.com/githubnext/agentics/blob/main/docs/repo-assist.md)."
  add-comment:
    max: 10
    target: "*"
    hide-older-comments: true
  create-pull-request:
    draft: true
    title-prefix: "[KeyBot] "
    labels: [automation, keybot]
    protected-files: fallback-to-issue
    max: 4
  push-to-pull-request-branch:
    target: "*"
    title-prefix: "[KeyBot] "
    protected-files: fallback-to-issue
    max: 4
  create-issue:
    title-prefix: "[KeyBot] "
    labels: [automation, keybot]
    max: 4
  update-issue:
    target: "*"
    title-prefix: "[KeyBot] "
    max: 1
  add-labels:
    allowed: [bug, enhancement, "help wanted", "good first issue", documentation, question, duplicate, wontfix, "needs triage", "needs investigation", performance, security, maintenance, "waiting for feedback"]
    max: 30
    target: "*"
  remove-labels:
    allowed: [bug, enhancement, "help wanted", "good first issue", documentation, question, duplicate, wontfix, "needs triage", "needs investigation", performance, security, maintenance, "waiting for feedback"]
    max: 5
    target: "*"

tools:
  web-fetch:
  github:
    toolsets: [all]
    min-integrity: none
  bash: true
  repo-memory: true

mcp-scripts:
  keycloak-docs:
    description: "Look up Keycloak and Keycloak.AuthServices documentation from the skills directory. Returns relevant reference content for a given topic."
    inputs:
      topic:
        type: string
        description: "Topic to search for (e.g., 'authentication', 'authorization', 'token introspection', 'admin-sdk', 'troubleshooting', 'configuration', 'resource-protection', 'organization-authorization', 'realm-management', 'client-configuration', 'security-hardening')"
    run: |
      SKILLS_DIR="skills"
      RESULTS=""
      for f in "$SKILLS_DIR"/*/references/*.md; do
        if grep -qil "$INPUT_TOPIC" "$f" 2>/dev/null; then
          RESULTS="$RESULTS\n--- $f ---\n$(cat "$f")\n"
        fi
      done
      if [ -z "$RESULTS" ]; then
        echo "No documentation found for topic: $INPUT_TOPIC"
        echo "Available reference files:"
        ls "$SKILLS_DIR"/*/references/*.md 2>/dev/null | sed 's/.*references\//  /'
      else
        echo -e "$RESULTS"
      fi

steps:
  - name: Fetch repo data for task weighting
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    run: |
      mkdir -p /tmp/gh-aw

      # Fetch open issues with labels (up to 500)
      gh issue list --repo "$GH_REPO" --state open --limit 500 --json number,labels > /tmp/gh-aw/issues.json

      # Fetch open PRs with titles (up to 200)
      gh pr list --repo "$GH_REPO" --state open --limit 200 --json number,title > /tmp/gh-aw/prs.json

      # Compute task weights and select two tasks for this run
      python3 - << 'EOF'
      import json, random, os

      with open('/tmp/gh-aw/issues.json') as f:
          issues = json.load(f)
      with open('/tmp/gh-aw/prs.json') as f:
          prs = json.load(f)

      open_issues     = len(issues)
      unlabelled      = sum(1 for i in issues if not i.get('labels'))
      keybot_prs      = sum(1 for p in prs if p['title'].startswith('[KeyBot]'))
      other_prs       = sum(1 for p in prs if not p['title'].startswith('[KeyBot]'))

      MAX_KEYBOT_PRS = 5
      at_pr_cap = keybot_prs >= MAX_KEYBOT_PRS

      task_names = {
          1:  'Issue Labelling',
          2:  'Issue Investigation and Comment',
          3:  'Issue Investigation and Fix',
          4:  'Engineering Investments',
          5:  'Coding Improvements',
          6:  'Maintain KeyBot PRs',
          7:  'Stale PR Nudges',
          8:  'Performance Improvements',
          9:  'Testing Improvements',
          10: 'Take the Repository Forward',
      }

      weights = {
          1:  1   + 3 * unlabelled,
          2:  3   + 1 * open_issues,
          3:  3   + 0.7 * open_issues,
          4:  5   + 0.2 * open_issues,
          5:  5   + 0.1 * open_issues,
          6:  float(keybot_prs),
          7:  0.1 * other_prs,
          8:  3   + 0.05 * open_issues,
          9:  3   + 0.05 * open_issues,
          10: 3   + 0.05 * open_issues,
      }

      # When open KeyBot PRs reach the cap, suppress all PR-creating tasks
      # and boost Task 6 so the bot focuses on landing existing work first.
      if at_pr_cap:
          for t in [3, 4, 5, 8, 9, 10]:
              weights[t] = 0.0
          weights[6] = max(weights[6], 10.0)

      run_id = int(os.environ.get('GITHUB_RUN_ID', '0'))
      rng = random.Random(run_id)

      task_ids     = list(weights.keys())
      task_weights = [weights[t] for t in task_ids]

      chosen, seen = [], set()
      for t in rng.choices(task_ids, weights=task_weights, k=30):
          if t not in seen:
              seen.add(t)
              chosen.append(t)
          if len(chosen) == 2:
              break

      print('=== KeyBot Task Selection ===')
      print(f'Open issues       : {open_issues}')
      print(f'Unlabelled issues : {unlabelled}')
      print(f'KeyBot PRs        : {keybot_prs}')
      print(f'Other open PRs    : {other_prs}')
      print(f'PR cap ({MAX_KEYBOT_PRS})        : {"⛔ REACHED — PR-creating tasks suppressed" if at_pr_cap else f"✅ OK ({keybot_prs}/{MAX_KEYBOT_PRS})"}')
      print()
      print('Task weights:')
      for t, w in weights.items():
          tag = ' <-- SELECTED' if t in chosen else ''
          print(f'  Task {t:2d} ({task_names[t]}): weight {w:6.1f}{tag}')
      print()
      print(f'Selected tasks for this run: Task {chosen[0]} ({task_names[chosen[0]]}) and Task {chosen[1]} ({task_names[chosen[1]]})')

      result = {
          'open_issues': open_issues, 'unlabelled_issues': unlabelled,
          'keybot_prs': keybot_prs, 'other_prs': other_prs,
          'max_keybot_prs': MAX_KEYBOT_PRS,
          'at_pr_cap': at_pr_cap,
          'task_names': task_names,
          'weights': {str(k): round(v, 2) for k, v in weights.items()},
          'selected_tasks': chosen,
      }
      with open('/tmp/gh-aw/task_selection.json', 'w') as f:
          json.dump(result, f, indent=2)
      EOF

